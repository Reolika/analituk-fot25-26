name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: Syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run syntax
      - run: npm run lint

  model-tests:
    name: Model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/run-model-tests.mjs
